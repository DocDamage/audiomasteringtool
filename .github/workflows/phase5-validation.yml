name: Phase 5 Validation

on:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  portable-phase5:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install runtime dependency
        run: sudo apt-get update && sudo apt-get install -y libsndfile1
      - name: Configure
        run: cmake --preset ninja-debug
      - name: Build
        run: cmake --build --preset ninja-debug
      - name: Separation policy
        continue-on-error: true
        run: ctest --preset ninja-debug -R '^phase5_source_guided_separation_policy$' --output-on-failure
      - name: Fingerprint/cache identity
        continue-on-error: true
        run: ctest --preset ninja-debug -R '^phase5_source_fingerprint_and_cache_identity$' --output-on-failure
      - name: Complete reconstruction contract
        continue-on-error: true
        run: ctest --preset ninja-debug -R '^phase5_complete_reconstruction_contract$' --output-on-failure
      - name: Reconstruction artifact evaluator
        continue-on-error: true
        run: ctest --preset ninja-debug -R '^phase5_reconstruction_artifact_evaluator$' --output-on-failure
      - name: Source-guided processing plan
        continue-on-error: true
        run: ctest --preset ninja-debug -R '^phase5_source_guided_processing_plan$' --output-on-failure
      - name: Source-control envelopes
        continue-on-error: true
        run: ctest --preset ninja-debug -R '^phase5_source_control_envelopes$' --output-on-failure
      - name: Source-guided stereo executor
        continue-on-error: true
        run: ctest --preset ninja-debug -R '^phase5_source_guided_stereo_executor$' --output-on-failure
      - name: Source-guided stereo renderer
        continue-on-error: true
        run: ctest --preset ninja-debug -R '^phase5_source_guided_stereo_renderer$' --output-on-failure
      - name: Source-guided mastering integration
        continue-on-error: true
        run: ctest --preset ninja-debug -R '^phase5_source_guided_mastering_integration$' --output-on-failure
      - name: Enforce aggregate Phase 5 suite
        run: ctest --preset ninja-debug -R '^phase5_' --output-on-failure
