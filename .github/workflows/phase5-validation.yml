name: Phase 5 Validation

on:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  portable-phase5:
    name: ${{ matrix.test }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        test:
          - phase5_source_guided_separation_policy
          - phase5_source_fingerprint_and_cache_identity
          - phase5_complete_reconstruction_contract
          - phase5_reconstruction_artifact_evaluator
          - phase5_source_guided_processing_plan
          - phase5_source_control_envelopes
          - phase5_source_guided_stereo_executor
          - phase5_source_guided_stereo_renderer
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install runtime dependency
        run: sudo apt-get update && sudo apt-get install -y libsndfile1
      - name: Configure
        run: cmake --preset ninja-debug
      - name: Build
        run: cmake --build --preset ninja-debug
      - name: Run ${{ matrix.test }}
        run: ctest --preset ninja-debug -R '^${{ matrix.test }}$' --output-on-failure
